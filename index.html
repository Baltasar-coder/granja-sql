<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granja SQL</title>
<style>
:root{
  --bg:#f3ecd6; --panel:#fffbea; --ink:#2b2a22; --muted:#7a7561; --line:#e3dcc3;
  --green:#4c8c2b; --green-d:#356b1a; --brown:#8b5a2b; --gold:#e0a21b; --red:#c0392b; --blue:#2f6fa3;
  --code:#1f2a1c; --codeink:#e9f5d8; --soil:#c9a46b; --grass:#b9d98a;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141813; --panel:#1c211b; --ink:#edf2ec; --muted:#a3ad9f; --line:#333d31;
    --green:#7cc444; --green-d:#95d95b; --brown:#d49a5c; --gold:#f4c44e; --red:#ef6a5b; --blue:#6aaee0;
    --code:#10140f; --codeink:#e9f5d8; --soil:#6d5532; --grass:#3c5a25; }
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.55 "Trebuchet MS",system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh;
  background:linear-gradient(#bfe3f7 0,#e9f5d0 220px,#cfe6a0 100%) fixed}
@media (prefers-color-scheme: dark){body{background:linear-gradient(#16283a 0,#1d2e1a 240px,#18260f 100%) fixed}}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 18px;color:#fff;
  background:linear-gradient(#5aa02c,#3f7d1d);border-bottom:5px solid #8b5a2b;box-shadow:0 4px 12px rgba(0,0,0,.3)}
@media (prefers-color-scheme: dark){header{background:linear-gradient(#3d6b1f,#2a4d14)}}
header h1{font-size:23px;margin:0;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.card{box-shadow:0 4px 0 rgba(120,90,40,.25),0 8px 18px rgba(0,0,0,.12)}
.card{border-radius:16px}
.mis.act{box-shadow:0 2px 0 var(--green-d)}
.cap{background:color-mix(in srgb,var(--gold) 22%,transparent);border-radius:8px;margin-top:12px}
h2{font-size:25px}
button.pri{font-size:16px;padding:9px 18px;box-shadow:0 3px 0 var(--green-d)}
button.pri:active{transform:translateY(2px);box-shadow:none}
.stat{font-size:16px;background:rgba(0,0,0,.25)}
.stat{background:rgba(255,255,255,.15);padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.stat.neg{background:var(--red)}
.xp{flex:1;min-width:160px;max-width:320px}
.xp small{display:block;font-size:12px;opacity:.9}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:8px}
button:hover{filter:brightness(.96)}
button.pri{background:var(--green);border-color:var(--green-d);color:#fff;font-weight:700}
button.gold{background:var(--gold);border-color:#b98305;color:#2b2200;font-weight:700}
header button{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:14px;padding:14px;align-items:start}
@media (max-width:1100px){main{grid-template-columns:220px minmax(0,1fr)} #side{grid-column:1/-1}}
@media (max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
nav.card{padding:8px;max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:64px}
@media (max-width:760px){nav.card{position:static;max-height:none}}
.cap{margin:8px 0 2px;padding:4px 8px;font-weight:700;font-size:13px;color:var(--brown)}
.mis{display:flex;gap:6px;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:7px;font-size:14px}
.mis:hover{background:var(--bg)}
.mis.act{background:var(--green);color:#fff}
.mis .n{opacity:.6;min-width:22px}
h2{margin:0 0 4px;font-size:21px}
.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--line);padding:1px 9px;border-radius:99px;color:var(--muted);margin-bottom:6px}
.story{color:var(--muted);font-style:italic;margin:4px 0 10px}
details{border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin:8px 0;background:var(--bg)}
summary{cursor:pointer;font-weight:700}
.goal{border-left:5px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);padding:8px 12px;border-radius:0 9px 9px 0;margin:10px 0}
pre,code{font-family:Consolas,Menlo,monospace}
.card pre{background:var(--code);color:var(--codeink);padding:9px 12px;border-radius:8px;overflow:auto;margin:8px 0;font-size:13.5px}
p code,li code,.goal code{background:var(--bg);border:1px solid var(--line);padding:0 5px;border-radius:5px;font-size:13px}
textarea{width:100%;min-height:150px;resize:vertical;background:var(--code);color:var(--codeink);border:2px solid var(--line);border-radius:9px;padding:10px;font:14px/1.5 Consolas,Menlo,monospace;tab-size:2}
textarea:focus{outline:none;border-color:var(--green)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
#msg{margin:8px 0;padding:10px 12px;border-radius:9px;display:none;white-space:pre-wrap}
#msg.ok{display:block;background:color-mix(in srgb,var(--green) 18%,transparent);border:1px solid var(--green)}
#msg.bad{display:block;background:color-mix(in srgb,var(--red) 14%,transparent);border:1px solid var(--red)}
#msg.info{display:block;background:var(--bg);border:1px solid var(--line)}
.rs{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:9px;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:4px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--bg);font-weight:700}
td.nul{color:var(--muted);font-style:italic}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green-d)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;border:2px solid rgba(0,0,0,.18);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);
  background:repeating-linear-gradient(0deg,#8a5a2b 0 7px,#744a21 7px 14px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.tile b{display:block;font-size:13px}
.tile .e{font-size:34px;line-height:1.15;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.tile.creciendo{background:repeating-linear-gradient(0deg,#6a9a2f 0 7px,#5a8626 7px 14px)}
.tile.listo{background:repeating-linear-gradient(0deg,#8bb83a 0 7px,#7aa530 7px 14px);border-color:var(--gold);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 14px 2px var(--gold)}}
.tile small{display:block;opacity:.95}
.pen{border:3px solid #9a6a35;border-radius:12px;padding:6px 10px 8px;margin:8px 0;background:linear-gradient(#c8e39a,#a8cf72);color:#2b2a22;box-shadow:0 3px 0 #6e4a22}
@media (prefers-color-scheme: dark){.pen{background:linear-gradient(#4b6e2c,#3b5b22);color:#f1ecd6}}
.pen.full{border-color:var(--red)}
.pen b{font-size:14px}.pen span.c{float:right;font-size:12px;opacity:.8}
.pen .an{font-size:28px;letter-spacing:3px;cursor:default;margin-top:2px}
.pen .an span{display:inline-block;transition:transform .15s}.pen .an span:hover{transform:translateY(-5px) scale(1.2)}
h3{margin:12px 0 4px;font-size:14px;color:var(--brown)}
.sch{margin:6px 0;font-size:13px}
.sch button{padding:1px 8px;font-weight:700;font-family:Consolas,monospace}
.sch div{color:var(--muted);padding-left:6px;font-family:Consolas,monospace;font-size:12.5px}
#diary{font-size:13px;color:var(--muted);max-height:120px;overflow:auto;margin:0;padding-left:18px}
.vl-board{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:inset 0 2px 8px rgba(0,0,0,.25)}
.vl-tip{font:12px Consolas,monospace;min-height:20px;margin-bottom:6px;color:var(--muted)}
.vl-tip b{color:var(--green-d)}.vl-tip code,.vl-sql code .kw{color:var(--gold)}
.vl-grid{display:grid;gap:5px;padding-bottom:5px}
.vl-tile{position:relative;aspect-ratio:1;border-radius:9px;padding:0;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-size:22px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),filter .18s}
.vl-tile:hover{transform:translateY(-3px) scale(1.05);z-index:3;filter:brightness(1.08)}
.vl-tile:active{transform:translateY(1px) scale(.97)}
.vl-grass{background:linear-gradient(155deg,#527c35,#395b22);box-shadow:0 4px 0 #263f17,0 6px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(173,224,125,.3)}
.vl-water{background:linear-gradient(155deg,#53a8e2,#2d74ab);box-shadow:0 4px 0 #1d517a,0 6px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(186,232,255,.4)}
.vl-dirt{background:linear-gradient(155deg,#cbb082,#a38556);box-shadow:0 4px 0 #745b36,0 6px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,240,212,.4)}
.vl-tile.sel{outline:2px solid #fae08c;outline-offset:1px}
.vl-decor{position:absolute;inset:0;overflow:hidden;border-radius:9px;pointer-events:none}
.vl-decor svg{width:100%;height:100%}
.vl-tile .spr{position:relative;z-index:2}
.vl-wave{animation:vlw 3.2s ease-in-out infinite}.vl-wave2{animation:vlw 3.2s ease-in-out 1.4s infinite}
@keyframes vlw{50%{transform:translate(2.5px,-1.5px)}}
.vl-hud{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 6px}
.vl-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.vl-card small{display:block;color:var(--muted);font-size:11px}.vl-card b{font-size:16px;color:var(--gold)}
.vl-bar{height:7px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:3px}
.vl-bar i{display:block;height:100%;background:linear-gradient(90deg,#d99f26,#95d95b);border-radius:9px;transition:width .3s}
.vl-sql{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--codeink)}
.vl-sql .vl-co{font-size:12px;color:#a8b3a2;margin-bottom:4px}
.vl-sql code{display:block;font-size:12px;word-break:break-word}.vl-sql code .kw{font-weight:700;color:#c792ea}
.vl-warn{font-size:12px;color:#f87171;margin-top:4px}
.vl-btns{display:flex;gap:6px;margin-top:6px}.vl-btns button{padding:3px 10px;font-size:13px}
.vl-cat{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow:auto}
.vl-row{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 8px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.vl-row.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.vl-ic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(0,0,0,.18);border-radius:9px;flex:none}
.vl-nm{flex:1;min-width:0}.vl-nm small{color:var(--muted);font-family:Consolas,monospace}
.vl-gold{font:700 12px Consolas,monospace;color:var(--gold)}.vl-in{font:12px Consolas,monospace;color:var(--muted);min-width:56px;text-align:right}.vl-in.pos{color:var(--green-d)}
.spr{width:1.2em;height:1.2em;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.35));object-fit:contain;vertical-align:middle}
img.spr{image-rendering:pixelated}
.spr.fill{width:92%;height:92%}

header{background-image:url(sprites/fondo_campo.png),linear-gradient(#5aa02c,#3f7d1d);background-size:cover;background-position:center}
.cf{position:fixed;top:-40px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
#mascot{position:fixed;right:14px;bottom:10px;z-index:8;display:flex;align-items:flex-end;gap:6px;flex-direction:row-reverse;pointer-events:none}
#face{font-size:46px;cursor:pointer;pointer-events:auto;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
#face.talk{animation:jump .5s 2}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes jump{50%{transform:translateY(-18px) rotate(-8deg)}}
#bubble{background:var(--panel);border:2px solid var(--brown);border-radius:14px 14px 4px 14px;padding:8px 12px;max-width:260px;font-size:13.5px;box-shadow:0 4px 10px rgba(0,0,0,.25);opacity:0;transform:scale(.9);transition:.25s;pointer-events:auto}
#bubble.on{opacity:1;transform:none}
.pen .an span{animation:hop 2.6s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-7px)}90%{transform:translateY(0) rotate(6deg)}}
.tile.creciendo .e{animation:sway 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{50%{transform:rotate(7deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:9;display:none;max-width:90vw}
/* Granja 2.5D (diseño "Granja y Aldea SQL") */
@keyframes harvestPulse{0%,100%{box-shadow:inset 0 -3px 8px rgba(34,58,16,.3),0 5px 0 #335418,0 0 0 2px #fbbf24,0 0 16px rgba(251,191,36,.45)}50%{box-shadow:inset 0 -3px 8px rgba(34,58,16,.25),0 6px 0 #335418,0 0 0 2.5px #fde047,0 0 24px rgba(253,224,71,.72)}}
.tile{background:radial-gradient(circle at 28% 25%,rgba(231,188,145,.18),transparent 46%),radial-gradient(circle at 75% 78%,rgba(44,26,12,.42),transparent 52%),linear-gradient(155deg,#875e3c,#6e4a2d 55%,#593a22);border:0;border-top:1.5px solid rgba(245,208,173,.32);box-shadow:inset 0 -3px 8px rgba(36,21,9,.42),0 5px 0 #382312,0 8px 14px rgba(0,0,0,.42);cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1),filter .18s;margin-bottom:5px}
.tile:hover{transform:translateY(-4px) scale(1.03);filter:brightness(1.07)}
.tile.creciendo{background:radial-gradient(circle at 22% 24%,rgba(217,249,157,.22),transparent 42%),radial-gradient(circle at 78% 76%,rgba(34,62,18,.35),transparent 50%),linear-gradient(155deg,#63993d,#4e7d2d 55%,#3d6621);border-top:1.5px solid rgba(217,249,157,.42);box-shadow:inset 0 -3px 8px rgba(25,46,12,.38),0 5px 0 #254014,0 8px 14px rgba(0,0,0,.42)}
.tile.listo{background:radial-gradient(circle at 50% 25%,rgba(254,240,138,.28),transparent 55%),radial-gradient(circle at 80% 80%,rgba(46,77,20,.35),transparent 50%),linear-gradient(155deg,#74ad44,#5b8e32 55%,#497526);border-top:1.5px solid rgba(254,240,138,.65);animation:harvestPulse 2.4s ease-in-out infinite}
.tile .e{filter:none}
.pen{background:radial-gradient(circle at 85% 20%,rgba(163,230,53,.12),transparent 45%),linear-gradient(165deg,#4b732e,#3b5d22 70%,#32501c);border:2px solid #8c6239;color:#f1ecd6;box-shadow:inset 0 2px 6px rgba(0,0,0,.35),inset 0 0 0 1px rgba(217,179,130,.22),0 4px 0 #4a3119,0 7px 14px rgba(0,0,0,.42);cursor:pointer;transition:transform .16s,border-color .16s}
.pen:hover{border-color:#b88754;transform:translateY(-2px)}
.pen.free{border:2px dashed #9c7649;background:repeating-linear-gradient(-45deg,rgba(180,142,92,.08) 0 6px,transparent 6px 12px),linear-gradient(165deg,#4e6934,#3d5427)}
.pen.free:hover{border-color:#f4c44e}
.pen.full{border-color:var(--red)}
.pen .an span{animation:none}
.pen .an .spr{animation:hop 2.8s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
/* pestañas táctiles y diario (diseño cozy) */
.tabs{background:rgba(0,0,0,.28);padding:6px;border-radius:16px;border:1px solid var(--line);box-shadow:inset 0 2px 6px rgba(0,0,0,.3);gap:6px}
.tabs button{border-radius:12px;font-weight:800;background:#272f25;color:#d6ddd3;border:1px solid #333d31;box-shadow:0 4px 0 #131712;transition:transform .1s,box-shadow .1s;margin-bottom:4px}
.tabs button:active{transform:translateY(2px);box-shadow:0 2px 0 #131712}
.tabs button.on{background:linear-gradient(#95d95b,#7cc444);color:#141813;border-color:#95d95b;box-shadow:0 4px 0 #4d8523}
.diary-box{display:flex;align-items:flex-start;gap:10px;background:#282219;border:1px solid #54442e;border-radius:14px;padding:10px;box-shadow:inset 0 2px 8px rgba(0,0,0,.45);margin-bottom:10px}
.diary-ic{width:38px;height:38px;flex:none;background:#382f22;border:1px solid #69553a;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:28px}
#diary{list-style:none;padding-left:0;color:#f6e6c0;line-height:1.5;flex:1;max-height:130px}
#diary li::before{content:"• ";color:#f4c44e;font-weight:700}
/* barra superior (diseño cozy) */
header.topbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 18px;color:#fff;background:radial-gradient(circle at 12% 20%,rgba(217,249,157,.22),transparent 45%),radial-gradient(circle at 88% 80%,rgba(28,56,14,.45),transparent 55%),linear-gradient(180deg,#5c962f,#487922 65%,#3c661b);border-bottom:3px solid #7d5329;box-shadow:inset 0 1px 0 rgba(236,252,203,.35),0 8px 24px rgba(0,0,0,.55)}
.topbar h1{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;margin:0;text-shadow:0 2px 2px rgba(0,0,0,.45)}
.topbar svg{width:18px;height:18px;flex:none}.topbar h1 svg{width:28px;height:28px}
.pill{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-weight:800;font-size:14px;color:#fff;background:rgba(24,43,12,.46);border:1px solid rgba(217,249,157,.24);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.pill b{font-family:Consolas,monospace}.pill .gold{color:#fae08c}.pill .gold.neg{color:#fca5a5}
.pill.rank{flex-direction:column;align-items:stretch;gap:4px;border-radius:16px;min-width:240px;padding:4px 12px}
.pill.rank .r{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#ecfccb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.rank .bar{height:6px;background:rgba(20,24,19,.7)}.pill.rank .bar i{background:linear-gradient(90deg,#bef264,#95d95b)}
.tb-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:12px;font-weight:800;font-size:14px;color:#fff;cursor:pointer;white-space:nowrap;background:rgba(255,255,255,.14);border:1px solid rgba(236,252,203,.34);box-shadow:0 3px 0 rgba(24,43,12,.65),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .12s,background-color .15s,box-shadow .12s}
.tb-btn.sq{width:36px;padding:0;justify-content:center}
.tb-btn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.tb-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(24,43,12,.65)}
.tb-btn span{display:flex}
/* bestiario (diseño cozy) */
.bs-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.bs-card{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:0;font-size:28px;border-radius:12px;cursor:pointer;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.08),transparent 55%),linear-gradient(160deg,#273025,#1d241c 75%,#171d16);border:1.5px solid #3c4939;box-shadow:0 3px 0 #111510,0 6px 12px rgba(0,0,0,.42);transition:transform .16s cubic-bezier(.34,1.56,.64,1),border-color .16s}
.bs-card:hover{transform:translateY(-3px) scale(1.03);border-color:#95d95b}
.bs-card.on{border-color:#f4c44e;background:radial-gradient(circle at 50% 20%,rgba(244,196,78,.16),transparent 65%),linear-gradient(160deg,#2e3829,#20281e);box-shadow:0 4px 0 #111510,0 0 0 2px rgba(244,196,78,.5)}
.bs-card .spr{width:80%;height:80%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
</style>
</head>

<script>
"use strict";
/* ====================== DATOS INICIALES ====================== */
const SCHEMA = `
CREATE TABLE granja(id INTEGER PRIMARY KEY, nombre TEXT, dinero REAL, dia INTEGER);
CREATE TABLE parcelas(id INTEGER PRIMARY KEY, nombre TEXT NOT NULL, hectareas REAL, suelo TEXT);
CREATE TABLE cultivos(id INTEGER PRIMARY KEY, nombre TEXT NOT NULL, emoji TEXT, precio_semilla REAL, precio_venta_kg REAL, dias_crecimiento INTEGER);
CREATE TABLE siembras(id INTEGER PRIMARY KEY, parcela_id INTEGER REFERENCES parcelas(id), cultivo_id INTEGER REFERENCES cultivos(id), dia_siembra INTEGER, kg_esperados REAL, estado TEXT DEFAULT 'creciendo');
CREATE TABLE corrales(id INTEGER PRIMARY KEY, nombre TEXT NOT NULL, capacidad INTEGER);
CREATE TABLE animales(id INTEGER PRIMARY KEY, nombre TEXT NOT NULL, especie TEXT NOT NULL, edad_meses INTEGER, peso_kg REAL, salud INTEGER DEFAULT 100, corral_id INTEGER REFERENCES corrales(id));
CREATE TABLE empleados(id INTEGER PRIMARY KEY, nombre TEXT NOT NULL, puesto TEXT, salario REAL, jefe_id INTEGER REFERENCES empleados(id));
CREATE TABLE clientes(id INTEGER PRIMARY KEY, nombre TEXT NOT NULL, ciudad TEXT);
CREATE TABLE ventas(id INTEGER PRIMARY KEY, cliente_id INTEGER REFERENCES clientes(id), cultivo_id INTEGER REFERENCES cultivos(id), kg REAL, precio_kg REAL, dia INTEGER);

CREATE TABLE edificios(id INTEGER PRIMARY KEY, nombre TEXT NOT NULL, emoji TEXT, coste REAL, ingreso_diario REAL, felicidad INTEGER);
CREATE TABLE mapa(id INTEGER PRIMARY KEY, x INTEGER, y INTEGER, terreno TEXT, edificio_id INTEGER REFERENCES edificios(id));
CREATE TABLE monstruos(id INTEGER PRIMARY KEY, nombre TEXT NOT NULL, emoji TEXT, piso INTEGER, vida INTEGER, ataque INTEGER, oro_botin INTEGER);
CREATE TABLE drops(monstruo_id INTEGER REFERENCES monstruos(id), material TEXT, cantidad INTEGER);
CREATE TABLE armas(id INTEGER PRIMARY KEY, nombre TEXT NOT NULL, ataque INTEGER, durabilidad INTEGER, nivel INTEGER);
INSERT INTO edificios VALUES (1,'Casa','🏠',200,5,10),(2,'Molino','🌬️',350,20,5),(3,'Pozo','⛲',100,0,8),(4,'Granero','🛖',400,25,3),(5,'Arbol','🌳',20,0,4),(6,'Mercado','🏪',600,45,6),(7,'Taberna','🍺',500,30,15);
INSERT INTO monstruos VALUES (1,'Slime','🟢',1,30,4,5),(2,'Murcielago','🦇',1,25,6,8),(3,'Esqueleto','💀',2,60,12,15),(4,'Goblin','👺',2,70,14,18),(5,'Lobo','🐺',3,110,20,30),(6,'Golem','🗿',3,200,18,45),(7,'Hada oscura','🧚',3,90,28,40),(8,'Dragon joven','🐉',4,350,45,120),(9,'Mago','🧙',4,180,50,100),(10,'Rey Slime','👑',5,500,40,400);
INSERT INTO drops VALUES (1,'Gelatina',2),(2,'Ala',1),(3,'Hueso',2),(4,'Cuero',1),(5,'Cuero',3),(5,'Colmillo',2),(6,'Piedra',4),(7,'Polvo',2),(8,'Escama',3),(8,'Hueso',2),(9,'Polvo',1),(10,'Gelatina',10),(10,'Corona',1);
INSERT INTO armas VALUES (1,'Espada de hierro',15,80,1),(2,'Hacha de piedra',22,40,1),(3,'Lanza',18,60,2),(4,'Daga',9,120,1),(5,'Martillo',35,25,1);
INSERT INTO granja VALUES (1,'Granja El Amanecer',3000,12);
INSERT INTO parcelas VALUES (1,'Norte',2.5,'arcilloso'),(2,'Sur',1.8,'arenoso'),(3,'Valle',3.2,'fertil'),(4,'Colina',1.2,'rocoso'),(5,'Huerto',0.8,'fertil'),(6,'Ribera',2.0,'fertil');
INSERT INTO cultivos VALUES (1,'Trigo','🌾',2,4,5),(2,'Maiz','🌽',3,6,7),(3,'Tomate','🍅',4,9,6),(4,'Zanahoria','🥕',2,5,4),(5,'Fresa','🍓',6,14,8),(6,'Calabaza','🎃',3,8,9),(7,'Patata','🥔',2,3,5);
INSERT INTO siembras VALUES (1,1,1,2,300,'cosechada'),(2,2,2,3,220,'cosechada'),(3,3,3,4,400,'cosechada'),(4,3,4,10,150,'creciendo'),(5,5,5,8,60,'creciendo'),(6,1,7,9,250,'creciendo'),(7,6,6,2,500,'listo');
INSERT INTO corrales VALUES (1,'Gallinero',20),(2,'Establo',8),(3,'Pocilga',6),(4,'Redil',12);
INSERT INTO animales VALUES
 (1,'Clotilde','gallina',18,2.1,95,1),(2,'Pepa','gallina',24,2.3,90,1),(3,'Rita','gallina',8,1.9,100,1),(4,'Lola','gallina',30,2.2,85,1),(5,'Nube','gallina',12,2.0,92,1),
 (6,'Margarita','vaca',36,600,90,2),(7,'Blanca','vaca',48,650,75,2),(8,'Estrella','vaca',24,550,95,2),
 (9,'Paco','cerdo',14,110,85,3),(10,'Trufa','cerdo',20,140,60,3),
 (11,'Lana','oveja',18,60,88,4),(12,'Algodon','oveja',30,70,92,4),(13,'Nieve','oveja',10,45,100,4),(14,'Bruno','oveja',40,80,70,4),
 (15,'Rayo','caballo',60,450,80,NULL);
INSERT INTO empleados VALUES (1,'Ana Ruiz','Capataz',180,NULL),(2,'Luis Mora','Agricultor',130,1),(3,'Marta Gil','Agricultora',135,1),(4,'Pedro Sanz','Ganadero',140,1),(5,'Sofia Vega','Veterinaria',200,1),(6,'Ivan Cruz','Agricultor',125,2),(7,'Elena Rubio','Ganadera',138,4),(8,'Hugo Pons','Tractorista',150,2);
INSERT INTO clientes VALUES (1,'Mercado Central','Madrid'),(2,'Bar La Espiga','Toledo'),(3,'Cooperativa Verde','Madrid'),(4,'Restaurante Sol','Valencia'),(5,'Panaderia Trigal','Toledo'),(6,'Hotel Mirador','Valencia'),(7,'Tienda Nueva','Sevilla');
`;
const ANIMAL_EMOJI = {gallina:'🐔',vaca:'🐄',cerdo:'🐖',oveja:'🐑',caballo:'🐴',pato:'🦆',cabra:'🐐',conejo:'🐇'};

/* ====================== MISIONES ====================== */
const CAPS = [
 {n:'Primeros brotes: SELECT',e:'🌱'},
 {n:'Manos a la tierra: modificar datos',e:'🚜'},
 {n:'Contando la cosecha: agregados',e:'📊'},
 {n:'Uniendo la granja: JOIN',e:'🔗'},
 {n:'Preguntas dentro de preguntas',e:'🧠'},
 {n:'Ventanas y conjuntos',e:'🪟'},
 {n:'Georama: construye tu aldea',e:'🏘️'},
 {n:'La Mazmorra',e:'⚔️'},
 {n:'Maestro de la granja',e:'🏆'}
];
const M = [];
function mis(cap, titulo, historia, teoria, objetivo, pista, solucion, o={}){
  M.push(Object.assign({id:M.length+1, cap, titulo, historia, teoria, objetivo, pista, solucion,
    tipo:'result', inicial:'-- Escribe tu SQL aquí\n', ordenado:false, recompensa:50+cap*25}, o));
}
const q = (c,s)=>c.q(s)[0]?.[0];

/* ---- Cap 0: SELECT ---- */
mis(0,'Echa un vistazo a tus parcelas','Acabas de heredar la <b>Granja El Amanecer</b>. Antes de plantar nada, necesitas saber qué tierras tienes.',
`<p>Una <b>base de datos</b> guarda la información en <b>tablas</b>: como hojas de cálculo con <i>columnas</i> (los campos) y <i>filas</i> (los registros). El lenguaje <b>SQL</b> sirve para preguntarle cosas.</p>
<p>La pregunta más básica es <code>SELECT</code> (elegir) + <code>FROM</code> (de qué tabla). El asterisco <code>*</code> significa "todas las columnas".</p>
<pre>SELECT * FROM cultivos;</pre>
<p>Consejo: mira la pestaña <b>🗄️ Datos</b> a la derecha para ver todas las tablas y sus columnas.</p>`,
'Muestra <b>todas las columnas y filas</b> de la tabla <code>parcelas</code>.',
'Te falta el nombre de la tabla después de FROM. Y termina con punto y coma ;','SELECT * FROM parcelas;',{inicial:'-- Escribe tu SQL aquí. Forma general:\n-- SELECT * FROM nombre_de_la_tabla;\n\n'});

mis(0,'Solo lo importante','Ana, tu capataz, solo quiere un listado corto: el nombre de cada parcela y su tamaño.',
`<p>En vez de <code>*</code> puedes pedir columnas concretas, separadas por comas. Salen en el orden que las escribas.</p>
<pre>SELECT nombre, precio_venta_kg FROM cultivos;</pre>
<p>Con <code>AS</code> puedes renombrar una columna en el resultado: <code>SELECT nombre AS cultivo FROM cultivos;</code></p>`,
'Muestra solo <code>nombre</code> y <code>hectareas</code> de todas las parcelas.',
'SELECT col1, col2 FROM tabla;','SELECT nombre, hectareas FROM parcelas;');

mis(0,'Solo tierra fértil','Quieres sembrar tomates, y solo crecen bien en suelo fértil. ¿Qué parcelas valen?',
`<p><code>WHERE</code> filtra las filas que cumplen una condición. Operadores: <code>=</code> <code>&lt;&gt;</code> (distinto) <code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code>. Combina condiciones con <code>AND</code>, <code>OR</code>, <code>NOT</code>.</p>
<p>Los <b>textos</b> van entre comillas simples: <code>'fertil'</code>.</p>
<pre>SELECT * FROM animales WHERE especie = 'vaca' AND salud &gt; 80;</pre>`,
'Muestra todas las columnas de las parcelas cuyo <code>suelo</code> sea <code>\'fertil\'</code> (sin tilde).',
"WHERE suelo = 'fertil'",'SELECT * FROM parcelas WHERE suelo = \'fertil\';');

mis(0,'Los cultivos más rentables','Hay que decidir qué plantar. Te interesan los 3 cultivos que mejor se pagan por kilo.',
`<p><code>ORDER BY columna</code> ordena (ascendente por defecto; <code>DESC</code> = de mayor a menor). <code>LIMIT n</code> se queda solo con las n primeras filas.</p>
<pre>SELECT nombre, peso_kg FROM animales ORDER BY peso_kg DESC LIMIT 5;</pre>
<p>El orden de las cláusulas importa: <code>SELECT … FROM … WHERE … ORDER BY … LIMIT</code>.</p>`,
'Muestra <code>nombre</code> y <code>precio_venta_kg</code> de los <b>3 cultivos</b> con mayor precio de venta, del más caro al más barato.',
'ORDER BY precio_venta_kg DESC y luego LIMIT 3','SELECT nombre, precio_venta_kg FROM cultivos ORDER BY precio_venta_kg DESC LIMIT 3;',{ordenado:true});

mis(0,'Buscando agricultores','Necesitas avisar a todos los empleados que trabajan la tierra. Sus puestos empiezan por "Agricult".',
`<p><code>LIKE</code> busca patrones en textos: <code>%</code> = cualquier cantidad de caracteres, <code>_</code> = exactamente uno.</p>
<pre>WHERE nombre LIKE 'M%'   -- empieza por M
WHERE nombre LIKE '%a'   -- acaba en a</pre>
<p>Otros atajos útiles: <code>IN ('a','b')</code>, <code>BETWEEN 1 AND 5</code>, <code>IS NULL</code> / <code>IS NOT NULL</code> (nunca <code>= NULL</code>).</p>`,
'Muestra <code>nombre</code> y <code>puesto</code> de los empleados cuyo puesto empiece por <code>Agricult</code>.',
"WHERE puesto LIKE 'Agricult%'","SELECT nombre, puesto FROM empleados WHERE puesto LIKE 'Agricult%';");

/* ---- Cap 1: modificar ---- */
mis(1,'¡A sembrar!','La parcela <b>Sur</b> (id 2) está vacía. Planta trigo (cultivo 1) hoy, día 12: se esperan 200 kg.',
`<p><code>INSERT INTO</code> añade filas nuevas. Indica las columnas y los valores en el mismo orden:</p>
<pre>INSERT INTO clientes (nombre, ciudad) VALUES ('Bar Pepe', 'Sevilla');</pre>
<p>Las columnas que no menciones toman su valor por defecto (o NULL). El <code>id</code> se asigna solo. Mira las columnas de <code>siembras</code> en la pestaña Datos.</p>`,
'Inserta en <code>siembras</code>: parcela 2, cultivo 1, día de siembra 12, 200 kg esperados y estado <code>\'creciendo\'</code>.',
'INSERT INTO siembras (parcela_id, cultivo_id, dia_siembra, kg_esperados, estado) VALUES (...)',
"INSERT INTO siembras (parcela_id, cultivo_id, dia_siembra, kg_esperados, estado) VALUES (2, 1, 12, 200, 'creciendo');",
{tipo:'state',inicial:'-- Mira la granja a la derecha después de ejecutar\n',
 check:c=> (q(c,"SELECT COUNT(*) FROM siembras WHERE parcela_id=2 AND cultivo_id=1 AND estado='creciendo' AND dia_siembra=12 AND kg_esperados=200")===1 && q(c,"SELECT COUNT(*) FROM siembras")===q({q:c.qb},"SELECT COUNT(*) FROM siembras")+1) || 'Debe haber exactamente UNA siembra nueva con parcela 2, cultivo 1, día 12, 200 kg y estado creciendo.'});

mis(1,'Llegan dos gallinas','Compras dos gallinas jóvenes: <b>Paloma</b> (2 meses, 1.5 kg) y <b>Plumas</b> (3 meses, 1.8 kg). Van al gallinero (corral 1).',
`<p>Un solo <code>INSERT</code> puede añadir varias filas separando los grupos de valores con comas:</p>
<pre>INSERT INTO clientes (nombre, ciudad)
VALUES ('Bar Pepe','Sevilla'),
       ('Bar Ana','Leon');</pre>
<p>No hace falta indicar <code>salud</code>: su valor por defecto es 100.</p>`,
'Inserta las dos gallinas en <code>animales</code> con <b>una sola sentencia</b> INSERT (especie <code>\'gallina\'</code>).',
'Columnas: nombre, especie, edad_meses, peso_kg, corral_id','INSERT INTO animales (nombre, especie, edad_meses, peso_kg, corral_id) VALUES (\'Paloma\',\'gallina\',2,1.5,1),(\'Plumas\',\'gallina\',3,1.8,1);',
{tipo:'state',check:c=>{
  const a=q(c,"SELECT COUNT(*) FROM animales WHERE nombre IN ('Paloma','Plumas') AND especie='gallina' AND corral_id=1 AND salud=100");
  return (a===2 && q(c,"SELECT COUNT(*) FROM animales")===q({q:c.qb},"SELECT COUNT(*) FROM animales")+2) || 'Deben existir exactamente 2 animales nuevos: Paloma y Plumas (gallinas, corral 1, salud por defecto).';}});

mis(1,'La veterinaria visita a Blanca','Blanca, la vaca, tiene la salud en 75. Sofía la cura: su salud pasa a 100.',
`<p><code>UPDATE tabla SET columna = valor WHERE condición</code> modifica filas existentes.</p>
<pre>UPDATE animales SET peso_kg = peso_kg + 5 WHERE nombre = 'Paco';</pre>
<p>⚠️ <b>Sin WHERE se modifican TODAS las filas.</b> Truco profesional: escribe primero el <code>SELECT</code> con ese mismo WHERE para ver qué filas vas a tocar.</p>`,
'Pon <code>salud = 100</code> solo para la vaca llamada <code>\'Blanca\'</code>.',
"UPDATE animales SET salud = 100 WHERE nombre = 'Blanca';",
"UPDATE animales SET salud = 100 WHERE nombre = 'Blanca';",
{tipo:'state',check:c=> (q(c,"SELECT salud FROM animales WHERE nombre='Blanca'")===100 && q(c,"SELECT SUM(salud) FROM animales WHERE nombre<>'Blanca'")===q({q:c.qb},"SELECT SUM(salud) FROM animales WHERE nombre<>'Blanca'")) || 'Blanca debe tener salud 100 y el resto de animales no deben cambiar.'});

mis(1,'Sube el mercado','Los precios suben un 10% en toda la región. Actualiza el precio de venta de TODOS los cultivos.',
`<p>Puedes usar la propia columna en el cálculo y no poner <code>WHERE</code> cuando quieras tocar todas las filas (aquí sí es lo que queremos):</p>
<pre>UPDATE cultivos SET precio_semilla = precio_semilla * 2;</pre>`,
'Multiplica <code>precio_venta_kg</code> de todos los cultivos por <code>1.10</code>.',
'UPDATE cultivos SET precio_venta_kg = precio_venta_kg * 1.10;','UPDATE cultivos SET precio_venta_kg = precio_venta_kg * 1.10;',
{tipo:'state',check:c=>{
  const a=c.q("SELECT id, precio_venta_kg FROM cultivos ORDER BY id"), b=c.qb("SELECT id, precio_venta_kg FROM cultivos ORDER BY id");
  return (a.length===b.length && a.every((r,i)=>Math.abs(r[1]-b[i][1]*1.1)<0.01)) || 'Todos los precios deben haber subido exactamente un 10%.';}});

mis(1,'¡Hora de cosechar!','Hay siembras con estado <code>\'listo\'</code> esperando en el campo. Cosecha todas.',
`<p>En esta granja, el ciclo de una siembra es: <code>creciendo</code> → <code>listo</code> (lo hace el botón <b>Siguiente día</b>) → <code>cosechada</code>.</p>
<p>Cosechar es simplemente un <code>UPDATE</code> del estado con un <code>WHERE</code> que elija las siembras listas.</p>`,
'Cambia a <code>\'cosechada\'</code> el estado de todas las siembras que estén en <code>\'listo\'</code>.',
"UPDATE siembras SET estado = 'cosechada' WHERE estado = 'listo';","UPDATE siembras SET estado = 'cosechada' WHERE estado = 'listo';",
{tipo:'state',check:c=> (q(c,"SELECT COUNT(*) FROM siembras WHERE estado='listo'")===0 && q(c,"SELECT COUNT(*) FROM siembras WHERE estado='cosechada'")===q({q:c.qb},"SELECT COUNT(*) FROM siembras WHERE estado IN ('listo','cosechada')") && q(c,"SELECT COUNT(*) FROM siembras WHERE estado='creciendo'")===q({q:c.qb},"SELECT COUNT(*) FROM siembras WHERE estado='creciendo'")) || 'Todas las siembras listas deben pasar a cosechada, y las que están creciendo no deben tocarse.'});

mis(1,'Vender el animal enfermo','Trufa (cerdo, salud 60) no se recupera. Decides vender todos los animales con salud inferior a 65.',
`<p><code>DELETE FROM tabla WHERE condición</code> borra filas.</p>
<pre>DELETE FROM clientes WHERE ciudad = 'Sevilla';</pre>
<p>🔥 <b>Sin WHERE borras la tabla entera.</b> Esta granja tiene botón de "Reiniciar granja", pero en el mundo real un DELETE sin WHERE es un clásico de pesadilla. Siempre: primero SELECT, luego DELETE.</p>`,
'Elimina de <code>animales</code> los de <code>salud</code> menor que 65.',
'DELETE FROM animales WHERE salud < 65;','DELETE FROM animales WHERE salud < 65;',
{tipo:'state',check:c=> (q(c,"SELECT COUNT(*) FROM animales WHERE salud<65")===0 && q(c,"SELECT COUNT(*) FROM animales")===q({q:c.qb},"SELECT COUNT(*) FROM animales WHERE salud>=65")) || 'Deben desaparecer solo los animales con salud menor que 65.'});

/* ---- Cap 2: agregados ---- */
mis(2,'¿Cuántos animales tengo?','Una inspección te pide el censo total de animales.',
`<p>Las <b>funciones de agregado</b> resumen muchas filas en un valor: <code>COUNT</code>, <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code>.</p>
<pre>SELECT COUNT(*) FROM clientes;           -- nº de filas
SELECT COUNT(DISTINCT ciudad) FROM clientes; -- ciudades distintas</pre>`,
'Devuelve el número total de filas de <code>animales</code>.',
'SELECT COUNT(*) FROM ...','SELECT COUNT(*) FROM animales;');

mis(2,'Balance de tierras','Calcula: hectáreas totales, media por parcela y la parcela más grande (en ese orden).',
`<p>Puedes usar varios agregados en la misma consulta:</p>
<pre>SELECT MIN(salario), MAX(salario), AVG(salario) FROM empleados;</pre>
<p>Los agregados ignoran los <code>NULL</code>, salvo <code>COUNT(*)</code>.</p>`,
'En una sola consulta: <code>SUM(hectareas)</code>, <code>AVG(hectareas)</code> y <code>MAX(hectareas)</code> sobre <code>parcelas</code>. (Da igual si redondeas a 2 decimales).',
'Tres funciones separadas por comas','SELECT SUM(hectareas), AVG(hectareas), MAX(hectareas) FROM parcelas;');

mis(2,'Censo por especie','Quieres saber cuántos animales de cada especie tienes.',
`<p><code>GROUP BY</code> divide las filas en grupos y aplica el agregado a cada grupo:</p>
<pre>SELECT ciudad, COUNT(*) FROM clientes GROUP BY ciudad;</pre>
<p>Regla de oro: toda columna del SELECT que no sea un agregado debe aparecer en el GROUP BY.</p>`,
'Muestra cada <code>especie</code> y cuántos animales hay de ella.',
'SELECT especie, COUNT(*) ... GROUP BY especie','SELECT especie, COUNT(*) FROM animales GROUP BY especie;');

mis(2,'Rebaños importantes','Solo te interesan las especies con más de 2 animales, y su peso medio.',
`<p><code>WHERE</code> filtra filas <i>antes</i> de agrupar. <code>HAVING</code> filtra grupos <i>después</i> de agrupar (y sí admite agregados):</p>
<pre>SELECT ciudad, COUNT(*) FROM clientes
GROUP BY ciudad
HAVING COUNT(*) &gt;= 2;</pre>`,
'Muestra <code>especie</code> y el peso medio (<code>AVG(peso_kg)</code>) solo de las especies con <b>más de 2</b> animales.',
'GROUP BY especie HAVING COUNT(*) > 2','SELECT especie, AVG(peso_kg) FROM animales GROUP BY especie HAVING COUNT(*) > 2;');

mis(2,'Semáforo de salud','Pedro quiere un informe: cada animal etiquetado como "sano" (salud ≥ 90), "regular" (70–89) o "grave" (menos de 70).',
`<p><code>CASE</code> es el "si… entonces…" de SQL, para crear columnas calculadas:</p>
<pre>SELECT nombre,
  CASE WHEN edad_meses &lt; 12 THEN 'joven'
       WHEN edad_meses &lt; 36 THEN 'adulto'
       ELSE 'veterano' END AS etapa
FROM animales;</pre>
<p>Otras funciones útiles: <code>ROUND(x,2)</code>, <code>UPPER()</code>, <code>LENGTH()</code>, <code>COALESCE(x, valor_si_null)</code>, <code>||</code> para unir textos.</p>`,
'Muestra <code>nombre</code> y una segunda columna con <code>\'sano\'</code>, <code>\'regular\'</code> o <code>\'grave\'</code> según la salud.',
'CASE WHEN salud >= 90 THEN ... WHEN salud >= 70 THEN ... ELSE ... END',
"SELECT nombre, CASE WHEN salud >= 90 THEN 'sano' WHEN salud >= 70 THEN 'regular' ELSE 'grave' END AS estado FROM animales;");

/* ---- Cap 3: JOIN ---- */
mis(3,'Cada animal en su corral','La tabla <code>animales</code> solo guarda el número del corral (<code>corral_id</code>). Quieres ver el nombre del corral.',
`<p>Las bases de datos reparten la información en tablas relacionadas mediante <b>claves</b>. <code>JOIN</code> las une:</p>
<pre>SELECT a.nombre, c.nombre
FROM animales a
JOIN corrales c ON a.corral_id = c.id;</pre>
<p><code>a</code> y <code>c</code> son <b>alias</b> de tabla. <code>JOIN</code> (= INNER JOIN) solo devuelve filas con pareja en ambas tablas.</p>`,
'Muestra el <code>nombre</code> de cada animal junto al <code>nombre</code> de su corral.',
'ON animales.corral_id = corrales.id','SELECT a.nombre, c.nombre FROM animales a JOIN corrales c ON a.corral_id = c.id;');

mis(3,'¿Quién anda suelto?','Algún animal no tiene corral asignado. Encuéntralo.',
`<p><code>LEFT JOIN</code> conserva <b>todas</b> las filas de la tabla izquierda, aunque no tengan pareja (las columnas de la derecha salen NULL). Ideal para detectar "huérfanos":</p>
<pre>SELECT c.nombre FROM clientes c
LEFT JOIN ventas v ON v.cliente_id = c.id
WHERE v.id IS NULL;</pre>`,
'Muestra el <code>nombre</code> de los animales que <b>no</b> tienen corral (usa LEFT JOIN con corrales).',
'LEFT JOIN corrales c ON ... WHERE c.id IS NULL','SELECT a.nombre FROM animales a LEFT JOIN corrales c ON a.corral_id = c.id WHERE c.id IS NULL;');

mis(3,'Siembras en marcha','Quieres un informe legible de lo que hay creciendo: parcela, cultivo y kilos esperados.',
`<p>Puedes encadenar varios JOIN. Cuando una tabla intermedia une otras dos (aquí <code>siembras</code> une parcelas y cultivos) es una <b>tabla puente</b>.</p>
<pre>FROM siembras s
JOIN parcelas p  ON s.parcela_id = p.id
JOIN cultivos cu ON s.cultivo_id = cu.id</pre>`,
'Muestra nombre de parcela, nombre de cultivo y <code>kg_esperados</code> de las siembras con estado <code>\'creciendo\'</code>.',
'Tres tablas, dos JOIN y un WHERE s.estado = ...',"SELECT p.nombre, cu.nombre, s.kg_esperados FROM siembras s JOIN parcelas p ON s.parcela_id = p.id JOIN cultivos cu ON s.cultivo_id = cu.id WHERE s.estado = 'creciendo';");

mis(3,'Mis mejores clientes','Calcula cuánto dinero ha dejado cada cliente (kg × precio_kg) y ordénalos del que más al que menos.',
`<p>JOIN + GROUP BY es la combinación estrella del análisis de datos. Los cálculos pueden ir dentro del agregado:</p>
<pre>SELECT c.nombre, SUM(v.kg * v.precio_kg)
FROM clientes c JOIN ventas v ON v.cliente_id = c.id
GROUP BY c.id;</pre>`,
'Muestra <code>nombre</code> del cliente y su total vendido, ordenado de mayor a menor total. (Solo clientes con ventas; da igual si redondeas a 2 decimales).',
'ORDER BY SUM(v.kg * v.precio_kg) DESC',
'SELECT c.nombre, SUM(v.kg * v.precio_kg) AS total FROM clientes c JOIN ventas v ON v.cliente_id = c.id GROUP BY c.id ORDER BY total DESC;',{ordenado:true});

mis(3,'El organigrama','Cada empleado tiene un <code>jefe_id</code> que apunta a otro empleado. Muestra quién manda a quién.',
`<p>Una tabla puede unirse <b>consigo misma</b> (<i>self join</i>) usando dos alias distintos:</p>
<pre>FROM empleados e
LEFT JOIN empleados j ON e.jefe_id = j.id</pre>
<p>Usa LEFT JOIN para que la capataz, que no tiene jefe, también aparezca.</p>`,
'Muestra el <code>nombre</code> de cada empleado y el nombre de su jefe (NULL si no tiene). Deben salir los 8 empleados.',
'Dos alias de la misma tabla','SELECT e.nombre, j.nombre FROM empleados e LEFT JOIN empleados j ON e.jefe_id = j.id;');

/* ---- Cap 4: subconsultas ---- */
mis(4,'Los pesos pesados','¿Qué animales pesan más que la media de la granja?',
`<p>Una <b>subconsulta</b> es un SELECT dentro de otro, entre paréntesis. Si devuelve un solo valor, puedes compararlo:</p>
<pre>SELECT nombre FROM empleados
WHERE salario &gt; (SELECT AVG(salario) FROM empleados);</pre>`,
'Muestra <code>nombre</code> y <code>peso_kg</code> de los animales con peso mayor que la media de <code>peso_kg</code> de todos.',
'peso_kg > (SELECT AVG(peso_kg) FROM animales)','SELECT nombre, peso_kg FROM animales WHERE peso_kg > (SELECT AVG(peso_kg) FROM animales);');

mis(4,'Clientes dormidos','Hay clientes que nunca te han comprado nada. Encuéntralos sin usar JOIN.',
`<p><code>IN (subconsulta)</code> comprueba si un valor está en una lista generada por otra consulta; <code>NOT IN</code> lo contrario.</p>
<pre>WHERE id NOT IN (SELECT cliente_id FROM ventas)</pre>
<p>⚠️ Si la subconsulta puede devolver NULL, <code>NOT IN</code> falla de forma silenciosa. <code>NOT EXISTS</code> es más seguro.</p>`,
'Muestra el <code>nombre</code> de los clientes cuyo <code>id</code> no aparece en <code>ventas.cliente_id</code>.',
'WHERE id NOT IN (SELECT ...)','SELECT nombre FROM clientes WHERE id NOT IN (SELECT cliente_id FROM ventas);');

mis(4,'Parcelas ocupadas','Quieres saber qué parcelas tienen ahora mismo alguna siembra creciendo.',
`<p><code>EXISTS</code> es verdadero si la subconsulta devuelve al menos una fila. Es una subconsulta <b>correlacionada</b>: se evalúa para cada fila de la consulta externa, usando sus valores:</p>
<pre>SELECT c.nombre FROM clientes c
WHERE EXISTS (SELECT 1 FROM ventas v
              WHERE v.cliente_id = c.id AND v.kg &gt; 100);</pre>`,
'Muestra el <code>nombre</code> de las parcelas que tienen alguna siembra con estado <code>\'creciendo\'</code>.',
'WHERE EXISTS (SELECT 1 FROM siembras s WHERE s.parcela_id = p.id AND ...)',
"SELECT p.nombre FROM parcelas p WHERE EXISTS (SELECT 1 FROM siembras s WHERE s.parcela_id = p.id AND s.estado = 'creciendo');");

mis(4,'Cultivos estrella (CTE)','Quieres los cultivos cuyos ingresos totales superan la media de ingresos por cultivo.',
`<p>Una <b>CTE</b> (<code>WITH</code>) da nombre a una consulta intermedia para usarla después como si fuera una tabla. Hace el SQL complejo legible, paso a paso:</p>
<pre>WITH por_cliente AS (
  SELECT cliente_id, SUM(kg) AS kg FROM ventas GROUP BY cliente_id
)
SELECT * FROM por_cliente WHERE kg &gt; (SELECT AVG(kg) FROM por_cliente);</pre>`,
'Con una CTE de ingresos (<code>SUM(kg*precio_kg)</code>) por <code>cultivo_id</code>, muestra el <code>nombre</code> del cultivo y su ingreso, solo si supera la media de ingresos por cultivo.',
'WITH ing AS (...) SELECT ... FROM ing JOIN cultivos ... WHERE total > (SELECT AVG(total) FROM ing)',
'WITH ing AS (SELECT cultivo_id, SUM(kg * precio_kg) AS total FROM ventas GROUP BY cultivo_id) SELECT cu.nombre, ing.total FROM ing JOIN cultivos cu ON cu.id = ing.cultivo_id WHERE ing.total > (SELECT AVG(total) FROM ing);');

/* ---- Cap 5: ventanas y conjuntos ---- */
mis(5,'Todos los nombres de la granja','Para el cartel de la fiesta, necesitas una lista única con los nombres de todos los empleados y todos los animales.',
`<p><code>UNION</code> apila los resultados de dos consultas (mismo nº de columnas) y elimina duplicados. <code>UNION ALL</code> los conserva (más rápido). También existen <code>INTERSECT</code> y <code>EXCEPT</code>.</p>
<pre>SELECT ciudad FROM clientes
UNION
SELECT nombre FROM parcelas;</pre>`,
'Una columna con los <code>nombre</code> de <code>empleados</code> unidos (UNION) a los de <code>animales</code>.',
'SELECT nombre FROM empleados UNION SELECT ...','SELECT nombre FROM empleados UNION SELECT nombre FROM animales;');

mis(5,'Ranking salarial','Haz un ranking de empleados por salario, del mejor pagado al peor, mostrando la posición.',
`<p>Las <b>window functions</b> calculan sobre un conjunto de filas <i>sin colapsarlas</i> (a diferencia de GROUP BY). Se reconocen por <code>OVER (...)</code>:</p>
<pre>SELECT nombre, kg,
  RANK() OVER (ORDER BY kg DESC) AS posicion
FROM ventas_resumen;</pre>
<p><code>RANK</code> deja huecos tras un empate (1,1,3), <code>DENSE_RANK</code> no (1,1,2), <code>ROW_NUMBER</code> numera sin empates (1,2,3).</p>`,
'Muestra <code>nombre</code>, <code>salario</code> y <code>RANK() OVER (ORDER BY salario DESC)</code>.',
'RANK() OVER (ORDER BY salario DESC)','SELECT nombre, salario, RANK() OVER (ORDER BY salario DESC) AS puesto FROM empleados;');

mis(5,'Comparando con la especie','Para cada animal, quieres ver su peso al lado del peso medio de SU especie.',
`<p><code>PARTITION BY</code> dentro de <code>OVER</code> reinicia el cálculo para cada grupo, como un GROUP BY que no pierde las filas individuales:</p>
<pre>SELECT nombre, ciudad,
  COUNT(*) OVER (PARTITION BY ciudad) AS clientes_en_ciudad
FROM clientes;</pre>`,
'Muestra <code>nombre</code>, <code>especie</code>, <code>peso_kg</code> y <code>AVG(peso_kg) OVER (PARTITION BY especie)</code> (sin redondear o a 2 decimales).',
'AVG(peso_kg) OVER (PARTITION BY especie)','SELECT nombre, especie, peso_kg, AVG(peso_kg) OVER (PARTITION BY especie) AS media_especie FROM animales;');

mis(5,'Ingresos acumulados','Dibuja la curva de caja: ingresos por día y el acumulado hasta ese día.',
`<p>Con <code>SUM(...) OVER (ORDER BY ...)</code> obtienes un <b>total acumulado</b>. Combínalo con una CTE: primero agrupas por día, luego acumulas.</p>
<pre>WITH d AS (SELECT dia, SUM(kg) AS t FROM ventas GROUP BY dia)
SELECT dia, t, SUM(t) OVER (ORDER BY dia) AS acumulado FROM d;</pre>
<p>Hermanas útiles: <code>LAG(col)</code> y <code>LEAD(col)</code> (valor de la fila anterior/siguiente), <code>NTILE(n)</code>.</p>`,
'Muestra <code>dia</code>, ingresos del día (<code>SUM(kg*precio_kg)</code>) e ingresos acumulados, ordenado por día.',
'CTE por día + SUM(t) OVER (ORDER BY dia)','WITH d AS (SELECT dia, SUM(kg * precio_kg) AS t FROM ventas GROUP BY dia) SELECT dia, t, SUM(t) OVER (ORDER BY dia) AS acumulado FROM d ORDER BY dia;',{ordenado:true});

/* ---- Cap 6: Georama ---- */
mis(6,'El plano de la aldea','Tu granja está junto a una aldea medio abandonada. Cada casilla del terreno es una fila de la tabla <code>mapa</code> (coordenadas <code>x</code>, <code>y</code>). Mira la pestaña <b>🏘️ Aldea</b>.',
`<p>Como en un <i>Georama</i>, el mapa es una cuadrícula: cada fila de <code>mapa</code> es una casilla con su <code>terreno</code> y, si hay algo construido, un <code>edificio_id</code>. Si la casilla está vacía, <code>edificio_id</code> es <b>NULL</b>.</p>
<p>Para preguntar por NULL se usa <code>IS NULL</code> (nunca <code>= NULL</code>):</p>
<pre>SELECT * FROM mapa WHERE edificio_id IS NULL;</pre>`,
'Muestra <code>x</code> e <code>y</code> de las casillas de terreno <code>\'hierba\'</code> que aún no tienen edificio.',
"WHERE terreno = 'hierba' AND edificio_id IS NULL","SELECT x, y FROM mapa WHERE terreno = 'hierba' AND edificio_id IS NULL;");

mis(6,'Levanta un molino','Un molino da 20 € al día. Constrúyelo en la casilla x=3, y=1.',
`<p>Construir en el Georama es un <code>UPDATE</code>: asignas el <code>id</code> del edificio a la casilla. Consulta qué id tiene el molino en la tabla <code>edificios</code>.</p>
<pre>UPDATE mapa SET edificio_id = 3 WHERE x = 2 AND y = 0;</pre>
<p>Dos condiciones con <code>AND</code> identifican una casilla única. ¡Sin ellas construirías en todo el mapa!</p>`,
'Pon el molino (mira su id en <code>edificios</code>) en la casilla x=3, y=1 de <code>mapa</code>.',
"SELECT id FROM edificios WHERE nombre='Molino'; luego UPDATE mapa SET edificio_id = ... WHERE x=3 AND y=1","UPDATE mapa SET edificio_id = 2 WHERE x = 3 AND y = 1;",
{tipo:'state',check:c=> (q(c,"SELECT edificio_id FROM mapa WHERE x=3 AND y=1")===2 && q(c,"SELECT COUNT(*) FROM mapa WHERE edificio_id IS NOT NULL")===q({q:c.qb},"SELECT COUNT(*) FROM mapa WHERE edificio_id IS NOT NULL")+1) || 'Solo la casilla (3,1) debe quedar con el Molino.'});

mis(6,'¿Qué hay construido?','Haz un inventario de la aldea: qué edificio hay en cada casilla ocupada.',
`<p>Une <code>mapa</code> con <code>edificios</code> mediante <code>edificio_id = edificios.id</code>. Con un <code>JOIN</code> normal, las casillas vacías (NULL) desaparecen del resultado, justo lo que queremos aquí.</p>`,
'Muestra el <code>nombre</code> del edificio y las coordenadas <code>x</code>, <code>y</code> de cada casilla ocupada.',
'FROM mapa m JOIN edificios e ON e.id = m.edificio_id','SELECT e.nombre, m.x, m.y FROM mapa m JOIN edificios e ON e.id = m.edificio_id;');

mis(6,'Renta y felicidad de la aldea','Cada día los edificios te dan dinero (<code>ingreso_diario</code>) y hacen feliz a la gente (<code>felicidad</code>). ¿Cuánto suman?',
`<p>JOIN + agregados otra vez: así se calculan los "indicadores" de cualquier negocio. Mira cómo el botón <b>Siguiente día</b> te paga justo esta suma.</p>
<pre>SELECT SUM(e.ingreso_diario) FROM mapa m JOIN edificios e ON e.id = m.edificio_id;</pre>`,
'En una consulta: suma de <code>ingreso_diario</code> y suma de <code>felicidad</code> de los edificios construidos en el mapa.',
'Dos SUM sobre mapa JOIN edificios','SELECT SUM(e.ingreso_diario), SUM(e.felicidad) FROM mapa m JOIN edificios e ON e.id = m.edificio_id;');

mis(6,'Tala los árboles','Los árboles de la fila superior (y = 0) estorban para construir. Quítalos, pero deja los demás.',
`<p>Demoler es poner la casilla otra vez en <b>NULL</b>. No usamos <code>DELETE</code> porque la casilla (la fila de <code>mapa</code>) debe seguir existiendo: solo se vacía.</p>
<pre>UPDATE mapa SET edificio_id = NULL WHERE ...;</pre>`,
'Vacía (<code>edificio_id = NULL</code>) las casillas de la fila <code>y = 0</code> que tengan un Árbol (id 5). Los árboles de otras filas no se tocan.',
'SET edificio_id = NULL WHERE y = 0 AND edificio_id = 5','UPDATE mapa SET edificio_id = NULL WHERE y = 0 AND edificio_id = 5;',
{tipo:'state',check:c=> (q(c,"SELECT COUNT(*) FROM mapa WHERE y=0 AND edificio_id=5")===0 && q(c,"SELECT COUNT(*) FROM mapa WHERE edificio_id=5")===q({q:c.qb},"SELECT COUNT(*) FROM mapa WHERE edificio_id=5 AND y<>0") && q(c,"SELECT COUNT(*) FROM mapa")===24) || 'Quita solo los árboles de y=0, sin borrar casillas ni tocar otros árboles.'});

mis(6,'Construir con presupuesto','Abre un Mercado en (4,2). Cuesta lo que indique la tabla <code>edificios</code>: debes cobrar el coste de tu dinero SIN escribir los números a mano.',
`<p>Una <b>subconsulta</b> puede ir dentro de un <code>UPDATE</code> para leer datos de otra tabla:</p>
<pre>UPDATE granja
SET dinero = dinero - (SELECT coste FROM edificios WHERE nombre = 'Taberna');</pre>
<p>Así, si cambia el precio del edificio, tu SQL sigue siendo correcto. Haz dos sentencias: una que coloque el edificio y otra que cobre.</p>`,
'1) Pon el Mercado (usa una subconsulta para su id) en la casilla (4,2). 2) Resta su <code>coste</code> a <code>granja.dinero</code> con otra subconsulta.',
"UPDATE mapa SET edificio_id = (SELECT id FROM edificios WHERE nombre='Mercado') WHERE ...; UPDATE granja SET dinero = dinero - (SELECT coste ...);",
"UPDATE mapa SET edificio_id = (SELECT id FROM edificios WHERE nombre = 'Mercado') WHERE x = 4 AND y = 2;\nUPDATE granja SET dinero = dinero - (SELECT coste FROM edificios WHERE nombre = 'Mercado');",
{tipo:'state',check:c=> {
  if(q(c,"SELECT edificio_id FROM mapa WHERE x=4 AND y=2")!==6) return 'El Mercado (id 6) debe estar en la casilla (4,2).';
  const d=q({q:c.qb},"SELECT dinero FROM granja")-q(c,"SELECT dinero FROM granja");
  return Math.abs(d-600)<0.01 || 'Debes cobrar exactamente el coste del Mercado (600). Has cobrado '+d+'.';}});

/* ---- Cap 7: Mazmorra ---- */
mis(7,'Piso 3: ¿qué hay ahí abajo?','Antes de bajar a la mazmorra, el gremio te da el bestiario (<code>monstruos</code>). Quieres ver los del piso 3, empezando por el más resistente.',
`<p>Repaso de <code>WHERE</code> + <code>ORDER BY</code>, pero ahora con otro "juego" de datos: el mismo SQL sirve para cualquier negocio, ¡o mazmorra!</p>`,
'Muestra <code>nombre</code> y <code>vida</code> de los monstruos del <code>piso</code> 3, de más a menos vida.',
'WHERE piso = 3 ORDER BY vida DESC','SELECT nombre, vida FROM monstruos WHERE piso = 3 ORDER BY vida DESC;',{ordenado:true});

mis(7,'Forja la Espada de hierro','El herrero sube de nivel tu Espada de hierro: +5 de ataque y +1 de nivel.',
`<p>Un <code>UPDATE</code> puede modificar varias columnas a la vez, separando las asignaciones con comas:</p>
<pre>UPDATE armas SET ataque = ataque + 2, durabilidad = durabilidad - 1 WHERE ...;</pre>`,
'Sube <code>ataque</code> en 5 y <code>nivel</code> en 1 solo para la \'Espada de hierro\'.',
'SET ataque = ataque + 5, nivel = nivel + 1 WHERE nombre = ...',"UPDATE armas SET ataque = ataque + 5, nivel = nivel + 1 WHERE nombre = 'Espada de hierro';",
{tipo:'state',check:c=> (q(c,"SELECT ataque*100+nivel FROM armas WHERE nombre='Espada de hierro'")===2002 && q(c,"SELECT SUM(ataque)+SUM(nivel) FROM armas WHERE nombre<>'Espada de hierro'")===q({q:c.qb},"SELECT SUM(ataque)+SUM(nivel) FROM armas WHERE nombre<>'Espada de hierro'")) || 'La espada debe quedar con ataque 20 y nivel 2, y el resto de armas sin cambios.'});

mis(7,'Armas para el Rey Slime','El jefe del piso 5 es el Rey Slime. Quieres armas que lo derroten en 25 golpes o menos: <code>ataque × 25 ≥ vida del jefe</code>.',
`<p>Usa una subconsulta para obtener la vida del jefe y compararla con un cálculo sobre cada arma:</p>
<pre>WHERE ataque * 25 &gt;= (SELECT vida FROM monstruos WHERE nombre = '...')</pre>`,

mis(8,'Venta segura (TRANSACCIÓN)','Vendes 100 kg de calabaza (cultivo 6) al Restaurante Sol (cliente 4) a 8.00 €/kg el día 12. Debes registrar la venta Y cobrar 800 € a la vez: o se hacen las dos cosas o ninguna.',

function seed(){
  if(db) db.close();
  db = new SQL.Database();
  db.exec(SCHEMA);
  let s=7; const rnd=()=>(s=(s*1103515245+12345)%2147483648)/2147483648;
  const cult=db.exec("SELECT id,precio_venta_kg FROM cultivos")[0].values;
  const st=db.prepare("INSERT INTO ventas (cliente_id,cultivo_id,kg,precio_kg,dia) VALUES (?,?,?,?,?)");
  for(let i=0;i<40;i++){
    const c=cult[Math.floor(rnd()*7)];
    st.run([1+Math.floor(rnd()*6), c[0], 20+Math.floor(rnd()*26)*5, Math.round(c[1]*(0.9+rnd()*0.25)*100)/100, 1+Math.floor(i/4)+ (i%4===3?0:0)]);
  }
  st.free();
  const pre={'1,1':1,'2,2':3,'0,0':5,'1,0':5,'3,0':5,'0,2':5};
  const mp=db.prepare("INSERT INTO mapa (x,y,terreno,edificio_id) VALUES (?,?,?,?)");
  for(let y=0;y<4;y++) for(let x=0;x<6;x++){

}

function execOn(d, sql){
  try{ const res=d.exec(sql); return {res, changes:d.getRowsModified()}; }
  catch(e){ try{d.exec('ROLLBACK')}catch(_){} return {error:e.message}; }
}
function restore(snap){ db.close(); db=new SQL.Database(snap); }

const norm=v=>v===null?'NULL':(typeof v==='number'?String(Math.round(v*100)/100):String(v));
function compare(u,e,ordenado){
  const U=u||{columns:[],values:[]}, E=e||{columns:[],values:[]};
  if(!u && e) return 'Tu SQL no devolvió ninguna fila. Se esperaban '+E.values.length+'.';
  if(U.columns.length!==E.columns.length) return 'Se esperaban '+E.columns.length+' columna(s) y tu consulta devuelve '+U.columns.length+'.';
  if(U.values.length!==E.values.length) return 'Se esperaban '+E.values.length+' fila(s) y tu consulta devuelve '+U.values.length+'.';
  let a=U.values.map(r=>r.map(norm).join('\u0001')), b=E.values.map(r=>r.map(norm).join('\u0001'));
  if(!ordenado){a.sort();b.sort();}
  for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return ordenado&&[...a].sort().join()===[...b].sort().join()
      ? 'Las filas son las correctas, pero el orden no es el pedido.' : 'Tienes el número correcto de filas y columnas, pero algunos valores no coinciden.';
  return true;
}

/* Evalúa una misión. Devuelve {ok,msg,res,changes,error} */
function evaluate(m, sql){
  if(!m) { const r=execOn(db,sql); return {...r, ok:null}; }
  const snap=db.export();
  if(m.tipo==='result'){
    const dU=new SQL.Database(snap), dE=new SQL.Database(snap);
    const r=execOn(dU,sql), ex=execOn(dE,m.solucion);
    let out;
    if(r.error) out={error:r.error,ok:false};
    else { const v=compare(r.res[r.res.length-1], ex.res[ex.res.length-1], m.ordenado); out={res:r.res,changes:0,ok:v===true,msg:v===true?'':v}; }
    dU.close(); dE.close(); return out;
  }
  const before=new SQL.Database(snap);
  const r=execOn(db,sql);
  if(r.error){ restore(snap); before.close(); return {error:r.error,ok:false}; }
  let v;
  try{ v=m.check({q:s=>dbq(s), qb:s=>qa(before,s), sql, sandbox:()=>new SQL.Database(db.export())}); }
  catch(e){ v='Error al comprobar: '+e.message; }
  before.close();
  if(v!==true){ restore(snap); return {res:r.res,changes:0,ok:false,msg:v+'\n(He deshecho los cambios para que puedas intentarlo de nuevo.)'}; }
  return {res:r.res,changes:r.changes,ok:true};
}

function beep(seq){

  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime;

}

      h+='<div class="sch"><button data-t="'+esc(n)+'">'+(t==='view'?'👁 ':'')+esc(n)+'</button> <small>'+cnt+' filas</small><div>'+cols.map(c=>(c[2]?'🔑':'')+esc(c[0])+' <small>'+esc(c[1])+'</small>').join(', ')+'</div></div>';

  }catch(e){}
  $('#pDb').innerHTML=h;
}
function renderResults(res, changes){
  if(!res||!res.length) return changes?'<div id="msg" class="info" style="display:block">✔ Ejecutado correctamente. Filas afectadas: '+changes+'.</div>':'<div id="msg" class="info" style="display:block">✔ Ejecutado correctamente (sin tabla de resultados).</div>';
  return res.map(r=>'<div class="rs"><table><tr>'+r.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+r.values.slice(0,300).map(row=>'<tr>'+row.map(v=>v===null?'<td class="nul">NULL</td>':'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table></div><small style="color:var(--muted)">'+r.values.length+' fila(s)'+(r.values.length>300?' (mostrando 300)':'')+'</small>').join('');
}
function renderCenter(){
  const m=M[cur-1];
  let h;
  if(!m){
    h='<span class="tag">Modo libre</span><h2>🧪 Laboratorio libre</h2><p class="story">Aquí no hay nota ni recompensa: practica, rompe cosas y explora. Si la granja se estropea, usa «Reiniciar granja».</p><details><summary>Ideas para probar</summary><ul><li><code>SELECT * FROM ventas LIMIT 10;</code></li><li><code>SELECT dia, SUM(kg*precio_kg) FROM ventas GROUP BY dia;</code></li><li><code>EXPLAIN QUERY PLAN SELECT * FROM ventas WHERE cliente_id = 3;</code></li><li><code>SELECT name FROM sqlite_master;</code></li></ul></details>';
  } else {
    h='<span class="tag">'+CAPS[m.cap].e+' Capítulo '+(m.cap+1)+' · '+CAPS[m.cap].n+' · Misión '+m.id+'/'+M.length+(prog.done[m.id]?' · ✅ completada':'')+' · 💰 '+m.recompensa+' €</span><h2>'+esc(m.titulo)+'</h2><p class="story">'+m.historia+'</p><details '+(prog.done[m.id]?'':'open')+'><summary>📖 Aprende</summary>'+m.teoria+'</details><div class="goal">🎯 <b>Objetivo:</b> '+m.objetivo+'</div>';
  }
  h+='<textarea id="ed" spellcheck="false" placeholder="Escribe tu SQL…"></textarea><div class="btns">';
  h+= m? '<button class="pri" id="bCheck">✔ Ejecutar y comprobar</button><button id="bRun">▶ Solo ejecutar</button><button id="bHint">💡 Pista</button><button id="bSol" style="display:none">🔓 Ver solución</button>' : '<button class="pri" id="bRun">▶ Ejecutar</button>';
  h+='<span style="flex:1"></span><small style="align-self:center;color:var(--muted)">Ctrl+Enter ejecuta</small></div><div id="msg"></div><div id="out"></div>';
  if(m){ const i=cur; h+='<div class="btns">'+(i>1?'<button data-go="'+(i-1)+'">← Anterior</button>':'')+(i<M.length?'<button data-go="'+(i+1)+'">Siguiente →</button>':'')+'</div>'; }
  $('#center').innerHTML=h;
  $('#ed').value = drafts[cur] ?? (m? m.inicial : 'SELECT * FROM animales;');
}
function say(kind,t){const e=$('#msg');e.className=kind;e.textContent=t;e.style.display='block';}
function friendly(err){
  if(/near "\."|near "\.\.\."/.test(err)) return '\n💡 Parece que en el editor queda un «...» de ejemplo. Borra esa línea (o cámbiala por el nombre de la tabla) y vuelve a ejecutar.';
  if(/no such table/i.test(err)) return '\n💡 Esa tabla no existe: revisa el nombre en la pestaña «Datos».';
  if(/no such column/i.test(err)) return '\n💡 Esa columna no existe en la tabla: revisa su nombre (¿ambigua entre dos tablas? usa alias a.col).';
  if(/syntax error/i.test(err)) return '\n💡 Error de sintaxis: revisa comas, paréntesis, comillas y el orden de las palabras clave.';
  if(/ambiguous/i.test(err)) return '\n💡 Columna ambigua: pon el alias de la tabla delante (a.nombre).';
  return '';
}
function runCurrent(check){
  const m=M[cur-1], sql=$('#ed').value; drafts[cur]=sql;
  if(!sql.trim()) return say('bad','Escribe primero algún SQL.');
  const r = (m&&check)? evaluate(m,sql) : (()=>{const x=execOn(db,sql);return {...x,ok:null};})();
  $('#out').innerHTML = r.error?'':renderResults(r.res,r.changes);
  if(r.error){ say('bad','❌ Error de SQL: '+r.error+friendly(r.error)); if(m&&check){ attempts[cur]=(attempts[cur]||0)+1; if(attempts[cur]>=3) $('#bSol').style.display=''; } }
  else if(m&&check){
    if(r.ok){
      let extra='';
      if(!prog.done[m.id]){
        const rk0=rankIdx(Object.keys(prog.done).length), first=(attempts[cur]||0)===0;
        prog.done[m.id]=true; prog.bonus+=m.recompensa; db.exec("UPDATE granja SET dinero = dinero + "+m.recompensa); extra=' ¡Recompensa: +'+m.recompensa+' €!';
        prog.streak=(prog.streak||0)+(first?1:0); if(!first) prog.streak=0;
        if(first && prog.streak>=2){ const sb=Math.min(prog.streak,5)*10; prog.bonus+=sb; db.exec("UPDATE granja SET dinero = dinero + "+sb); extra+=' 🔥 Racha x'+prog.streak+': +'+sb+' € extra.'; }
        const rk1=rankIdx(Object.keys(prog.done).length);
        if(rk1>rk0){ beep(SND.lvl); confetti(['👑','⭐','🌟','🎉','🌾'],70); toast('🎖️ ¡Nuevo rango: '+RANGOS[rk1][1]+'!'); mascot('¡Subes a '+RANGOS[rk1][1]+'! Estoy orgulloso de ti.'); }
        else { beep(SND.win); confetti(['🌽','🍅','🥕','🍓','⭐','🌾'],36); mascot(pick(['¡Bien cosechado! 🌾','¡Esa consulta es de campeón!','¡Perfecto! Cobra tu recompensa.','¡Así se hace, granjero!'])); }
      } else { beep(SND.coin); mascot('Ya habías completado esta, pero repasar nunca viene mal.'); }
      say('ok','✅ ¡Correcto!'+extra+(m.id<M.length?' Pasa a la siguiente misión.':' ¡Has completado Granja SQL! Eres oficialmente un experto. 👑'));
      if(m.id===M.length) toast('🎉 ¡Has terminado todas las misiones!');
    } else { attempts[cur]=(attempts[cur]||0)+1; say('bad','❌ Todavía no.\n'+r.msg); prog.streak=0; beep(SND.lose); mascot(pick(['¡Casi! Lee bien el objetivo. 🧐','No pasa nada, los errores son abono para aprender.','Dale otra vuelta… ¿has mirado la pista?','Respira y revisa el nombre de las columnas.'])); }
    if(attempts[cur]>=3 && !r.ok) $('#bSol').style.display='';
  }
  else if(m && !check) say('info','Ejecutado como prueba. Cuando estés listo, pulsa «Ejecutar y comprobar».');
  save(); renderHeader(); renderFarm(); renderVillage(); renderDb(); renderNav();
}
function go(i){ if(M[cur-1]||cur===0) { const e=$('#ed'); if(e) drafts[cur]=e.value; } cur=i; renderNav(); renderCenter(); window.scrollTo({top:0}); }

function nextDay(){
  try{
    const bef=dbq("SELECT COUNT(*) FROM siembras WHERE estado='listo'")[0][0];
    db.exec("UPDATE granja SET dia = dia + 1");
    let ev=null;
    if(Math.random()<0.55){
      const hay=()=>dbq("SELECT COUNT(*) FROM siembras WHERE estado='creciendo'")[0][0]>0;
      const E=[
        ['🌧️ Llueve: los cultivos crecen un día más rápido.',"UPDATE siembras SET dia_siembra = dia_siembra - 1 WHERE estado = 'creciendo';",hay],
        ['🐛 Plaga: una siembra pierde el 10% de su cosecha.',"UPDATE siembras SET kg_esperados = ROUND(kg_esperados * 0.9) WHERE id = (SELECT id FROM siembras WHERE estado = 'creciendo' ORDER BY RANDOM() LIMIT 1);",hay],
        ['🎪 Feria del pueblo: ¡ganas 150 €!',"UPDATE granja SET dinero = dinero + 150;"],
        ['🦊 Un zorro asusta a una gallina: pierde 10 de salud.',"UPDATE animales SET salud = MAX(salud - 10, 0) WHERE id = (SELECT id FROM animales WHERE especie = 'gallina' ORDER BY RANDOM() LIMIT 1);"],
        ['🥚 Día de huevos: 3 € por gallina.',"UPDATE granja SET dinero = dinero + 3 * (SELECT COUNT(*) FROM animales WHERE especie = 'gallina');"],
        ['📸 Llegan turistas y compran recuerdos: +60 €.',"UPDATE granja SET dinero = dinero + 60;"]];
      const e=pick(E);
      try{ if(!e[2]||e[2]()){ db.exec(e[1]); ev=e; } }catch(x){}
    }
    db.exec("UPDATE siembras SET estado='listo' WHERE estado='creciendo' AND (SELECT dia FROM granja) - dia_siembra >= (SELECT dias_crecimiento FROM cultivos WHERE id = cultivo_id)");
    const dia=dbq("SELECT dia FROM granja")[0][0];
    diary.push('Día '+dia+': amanece en la granja.');
    if(ev){ diary.push('EVENTO '+ev[0]); diary.push('SQL: '+ev[1]); toast(ev[0]); beep(SND.coin); mascot('¡Evento! Se resolvió con este SQL: '+ev[1]); }
    const nuevos=dbq("SELECT COUNT(*) FROM siembras WHERE estado='listo'")[0][0]-bef;
    try{ const ing=dbq("SELECT COALESCE(SUM(e.ingreso_diario),0) FROM mapa m JOIN edificios e ON e.id=m.edificio_id")[0][0];
      if(ing>0){ db.exec("UPDATE granja SET dinero = dinero + "+ing); diary.push('🏘️ La aldea te paga '+money(ing)+' de renta.'); } }catch(e){}
    if(nuevos>0) diary.push('🌾 '+nuevos+' siembra(s) lista(s) para cosechar.');
    if(dia%7===0){ const s=dbq("SELECT COALESCE(SUM(salario),0)/4 FROM empleados")[0][0]; db.exec("UPDATE granja SET dinero = dinero - "+s); diary.push('💸 Día de paga: -'+money(s)+' en sueldos.'); toast('💸 Día de paga: -'+money(s)); }
  }catch(e){ toast('No se pudo avanzar el día: '+e.message); }
  save(); renderHeader(); renderFarm(); renderVillage(); renderDb();
}

/* Autotest: ejecuta la solución de cada misión desde una granja limpia */
function selfTest(){
  const bad=[], keep=JSON.stringify(prog); const keepDone=prog.done; prog.done={}; prog.bonus=0;
  M.forEach(m=>{
    seed();
    const ok=evaluate(m,m.solucion); if(!ok.ok) bad.push(m.id+' "'+m.titulo+'": '+(ok.error||ok.msg));
    seed(); const neg=evaluate(m, m.tipo==='result'?'SELECT 1':'SELECT 1;');
    if(neg.ok) bad.push(m.id+' acepta una respuesta incorrecta');
  });
  prog=JSON.parse(keep); seed(); return bad.length?bad:'OK: '+M.length+' misiones';
}
window.selfTest=selfTest;

/* ====================== ARRANQUE ====================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-fc],[data-fp],[data-fe]'); if(!t) return;
  if(t.dataset.i!==undefined) go(+t.dataset.i);
  else if(t.dataset.go) go(+t.dataset.go);
  else if(t.dataset.t){ const ed=$('#ed'); if(ed){ ed.value='SELECT * FROM '+t.dataset.t+';'; ed.focus(); } }
  else if(t.id==='bCheck') runCurrent(true);
  else if(t.id==='bRun') runCurrent(false);
  else if(t.id==='bHint'){ say('info','💡 '+M[cur-1].pista); }
  else if(t.id==='bSol'){ $('#ed').value=M[cur-1].solucion; say('info','Esta es una solución posible. Léela, entiéndela y pulsa «Ejecutar y comprobar». ¡Luego intenta explicarla con tus palabras!'); }
  else if(t.dataset.vx!==undefined){ vlSel={x:+t.dataset.vx,y:+t.dataset.vy}; if(t.dataset.vt==='agua') mascot('No se puede construir sobre el agua: mira la columna terreno de la tabla mapa.'); renderVillage(); }
  else if(t.dataset.vb){ vlB=+t.dataset.vb; renderVillage(); }
  else if(t.id==='vlSend'){ const ed=$('#ed'); if(ed){ ed.value=vlLast; drafts[cur]=vlLast; ed.focus(); mascot('Te he escrito el SQL en el editor. Ejecútalo para ver cómo cambia la aldea.'); toast('SQL enviado al editor'); } }
  else if(t.id==='vlCopy'){ try{ navigator.clipboard.writeText(vlLast); toast('SQL copiado'); }catch(e){ toast('No se pudo copiar'); } }
  else if(t.dataset.fp!==undefined){ const pid=t.dataset.fp, es=t.dataset.fs; let dia=1; try{dia=dbq("SELECT dia FROM granja")[0][0];}catch(x){}
    fsql= es==='listo' ? "UPDATE siembras SET estado = 'cosechada' WHERE parcela_id = "+pid+" AND estado = 'listo';" : es==='creciendo' ? "SELECT * FROM siembras WHERE parcela_id = "+pid+" AND estado = 'creciendo';" : "INSERT INTO siembras (parcela_id, cultivo_id, dia_siembra, kg_esperados, estado) VALUES ("+pid+", 1, "+dia+", 200, 'creciendo');";
    fctx='parcela '+pid; renderFarm(); }
  else if(t.dataset.fc!==undefined){ fsql= +t.dataset.fc>0 ? "SELECT * FROM animales WHERE corral_id = "+t.dataset.fc+";" : "SELECT * FROM animales WHERE corral_id IS NULL;"; fctx='animales'; renderFarm(); }
  else if(t.dataset.fe!==undefined){ fsql='SELECT COUNT(*), SUM(salario) FROM empleados;'; fctx='empleados'; renderFarm(); }
  else if(t.id==='fSend'){ const ed=$('#ed'); if(ed){ ed.value=fsql; drafts[cur]=fsql; ed.focus(); mascot('SQL escrito en el editor. ¡Ejecútalo para ver el efecto!'); toast('SQL enviado al editor'); } }
  else if(t.id==='fCopy'){ try{ navigator.clipboard.writeText(fsql); toast('SQL copiado'); }catch(x){ toast('No se pudo copiar'); } }  else if(t.dataset.bs){ bsSel=+t.dataset.bs; renderDb(); }
  else if(t.id==='bsSend'){ const ed=$('#ed'); if(ed){ ed.value=bsSql; drafts[cur]=bsSql; ed.focus(); mascot('Consulta del bestiario escrita en el editor.'); toast('SQL enviado al editor'); } }
  else if(t.id==='bsCopy'){ try{ navigator.clipboard.writeText(bsSql); toast('SQL copiado'); }catch(x){ toast('No se pudo copiar'); } }
  else if(t.id==='btnNext') nextDay();
  else if(t.id==='btnSnd'){ prog.mute=!prog.mute; save(); renderHeader(); if(!prog.mute) beep(SND.coin); }
  else if(t.id==='face') mascot(pick(TIPS));
  else if(t.id==='btnReset'){ if(!resetArmed){ resetArmed=true; $('#resetLbl').textContent='¿Seguro? Pulsa otra vez'; clearTimeout(resetT); resetT=setTimeout(()=>{resetArmed=false;$('#resetLbl').textContent='Reiniciar granja';},3500); } else { resetArmed=false; clearTimeout(resetT); $('#resetLbl').textContent='Reiniciar granja'; seed(); diary=[]; save(); renderAll(); toast('Granja restaurada'); } }
  else if(t.id==='tFarm'||t.id==='tDb'||t.id==='tVil'){ ['Farm','Vil','Db'].forEach(k=>{ const on='t'+k===t.id; $('#p'+k).style.display=on?'':'none'; $('#t'+k).classList.toggle('on',on); }); }
});
document.addEventListener('mouseover',e=>{
  const t=e.target.closest&&e.target.closest('.vl-tile'); const tip=$('#vlTip'); if(!t||!tip) return;
  tip.innerHTML='<b>('+t.dataset.vx+', '+t.dataset.vy+')</b> '+esc(t.dataset.vt)+(t.dataset.vn?' · '+esc(t.dataset.vn):'')+' <code>WHERE x = '+t.dataset.vx+' AND y = '+t.dataset.vy+'</code>';
});
document.addEventListener('keydown',e=>{
  if(e.target.id!=='ed') return;
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); runCurrent(!!M[cur-1]); }
  if(e.key==='Tab'){ e.preventDefault(); const t=e.target,s=t.selectionStart; t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd); t.selectionStart=t.selectionEnd=s+2; }
});
function renderAll(){ renderHeader(); renderNav(); renderCenter(); renderFarm(); renderVillage(); renderDb(); }

(async function(){
  try{
    SQL = await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/'+f});
  }catch(e){ $('#center').innerHTML='<h2>No se pudo cargar el motor SQL</h2><p>Esta página necesita conexión a internet la primera vez (descarga sql.js desde cdnjs). Error: '+esc(e.message||e)+'</p>'; return; }
  if(!loadSaved()) seed();
  const first=M.findIndex(m=>!prog.done[m.id]); cur = first<0?0:first+1;
  renderAll();
  $('#face').innerHTML=spr('tio_remo','🧑‍🌾');
  
  setTimeout(()=>mascot('¡Hola, soy Tío Remo! Te enseño SQL a golpe de arado. Pulsa en mí cuando quieras un consejo. 🌾'),600);
})();
